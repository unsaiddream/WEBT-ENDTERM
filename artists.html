<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Explore artist examples from music cities." />
    <title>Artists | Music Map</title>
    <link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" />

    <link href="assets/style.css?v=5" rel="stylesheet" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="navbar navbar-expand-lg" aria-label="Main navigation">
        <div class="container">
          <a class="brand" href="index.html">Music Map</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#main-nav"
            aria-controls="main-nav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="main-nav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="map.html">Map</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="artists.html" aria-current="page">Artists</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="genres.html">Genres</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contact.html">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main id="main">
      <section class="page-hero">
        <div class="container">
          <h1>Artists</h1>
          <p>A few artists from the cities on the map.</p>
        </div>
      </section>
      <section class="section-sm pt-0">
        <div class="container">
          <form id="artist-filters" class="row g-3 mb-4" role="search">
            <div class="col-md-6">
              <label class="form-label" for="artist-search">Search artists</label>
              <input class="form-control" type="search" id="artist-search" placeholder="Artist, city or genre" />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="city-filter">City</label>
              <select class="form-select" id="city-filter"><option value="">All cities</option></select>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="genre-filter">Genre</label>
              <select class="form-select" id="genre-filter"><option value="">All genres</option></select>
            </div>
            <div class="col-12 filter-actions">
              <label><input class="form-check-input me-2" type="checkbox" id="saved-only" />Saved artists only</label>
              <button class="btn btn-outline-secondary btn-sm" type="reset">Clear filters</button>
            </div>
          </form>
          <p id="artist-count" role="status" aria-live="polite"></p>
          <ul id="artist-list" class="row g-4 list-unstyled"></ul>
          <noscript><p>Enable JavaScript to search the artists. Artist examples are also listed on the Genres page.</p></noscript>
          <p id="save-status" class="small text-muted-custom" role="status" aria-live="polite">Saved artists stay in this browser.</p>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container text-center text-md-start">
        <span>Music Map</span>
        <span>Endterm project</span>
      </div>
    </footer>
    <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="assets/data.js"></script>
    <script src="assets/app.js?v=5"></script>
  </body>
</html>
