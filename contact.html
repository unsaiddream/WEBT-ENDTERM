<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Suggest an artist for Music Map." />
    <title>Contact | Music Map</title>
    <link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" />

    <link href="assets/style.css?v=5" rel="stylesheet" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="navbar navbar-expand-lg" aria-label="Main navigation">
        <div class="container">
          <a class="brand" href="index.html">Music Map</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#main-nav"
            aria-controls="main-nav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="main-nav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="map.html">Map</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="artists.html">Artists</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="genres.html">Genres</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="contact.html" aria-current="page">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main id="main">
      <section class="page-hero">
        <div class="container">
          <h1>Suggest an artist</h1>
          <p>Use this demo form to preview a suggestion. Nothing is sent.</p>
        </div>
      </section>
      <section class="section-sm pt-0">
        <div class="container">
          <div class="row g-4">
            <div class="col-lg-8">
              <form id="suggestion-form" class="panel" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="name">Your name</label>
                    <input class="form-control" id="name" name="name" type="text" maxlength="60" placeholder="Your name" required aria-describedby="name-error" />
                    <p class="field-error" id="name-error"></p>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" name="email" type="email" maxlength="120" placeholder="name@example.com" required aria-describedby="email-error" />
                    <p class="field-error" id="email-error"></p>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="artist">Artist</label>
                    <input class="form-control" id="artist" name="artist" type="text" maxlength="100" placeholder="Artist name" required aria-describedby="artist-error" />
                    <p class="field-error" id="artist-error"></p>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="city">City</label>
                    <input class="form-control" id="city" name="city" type="text" maxlength="100" placeholder="City and country" required aria-describedby="city-error" />
                    <p class="field-error" id="city-error"></p>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="genre">Genre</label>
                    <select class="form-select" id="genre" name="genre" required aria-describedby="genre-error">
                      <option value="">Choose a genre</option>
                      <option>Pop</option><option>Hip-hop</option><option>Electronic</option>
                      <option>Alternative</option><option>Jazz</option><option>Other</option>
                    </select>
                    <p class="field-error" id="genre-error"></p>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="reason">Why do you recommend this artist?</label>
                    <textarea class="form-control" id="reason" name="reason" rows="4" maxlength="500" required aria-describedby="reason-help reason-error"></textarea>
                    <p id="reason-help" class="small text-muted-custom mt-1">10–500 characters. <span id="reason-count">0</span>/500</p>
                    <p class="field-error" id="reason-error"></p>
                  </div>
                  <div class="col-12">
                    <button class="btn btn-primary" type="submit">Preview suggestion</button>
                    <p id="form-status" role="status" class="mt-3 mb-0" aria-live="polite"></p>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container text-center text-md-start">
        <span>Music Map</span>
        <span>Endterm project</span>
      </div>
    </footer>
    <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="assets/contact.js"></script>
  </body>
</html>
